# ---------------------------------------------------------------------------
# Appended during Implementation Phase 5, Step 5.1.
#
# Entries below resolve a contradiction between two source documents. They do
# not require an owner answer, because the plan's acceptance criteria already
# determine which of the two sources wins. An owner may still override them.
# ---------------------------------------------------------------------------
resolved_decisions:
  section_5_6_boundary:
    value: "Section 5 runs minutes 70 to 85. Section 6 runs minutes 85 to 90."
    status: "resolved"
    resolved_on: "2026-09-22"
    resolved_by: "Implementation Phase 5, Step 5.1"
    conflict: >-
      Two source documents disagree. The research Profile 1 Schedule table puts
      section 5 at minutes 70 to 84 and the wrap-up at 84 to 90, which is an
      allocation of 15/15/25/15/14/6. The 22-slide storyboard puts section 5 at
      70 to 85 and section 6 at 85 to 90, which is 15/15/25/15/15/5.
    rationale: >-
      The plan's first success criterion requires the 15/15/25/15/15/5
      allocation, and decisions.yml already records that allocation under
      phase_0_decisions.duration.allocation_minutes. Only the storyboard
      boundary satisfies both, so the storyboard is authoritative. The slide
      windows in slides/content.json already use it, and the deck generator
      recomputes and enforces the allocation on every build, so the two would
      have diverged loudly rather than silently.
    consequence: >-
      The one minute of recoverable wrap-up buffer described in the research
      schedule table does not exist. Section 6 holds exactly the 5 minutes the
      README gives it. Overrun is absorbed entirely through the published cut
      order in docs/facilitator-runbook.md, which is the only recovery
      mechanism the delivered schedule has.
    affects:
      - "slides/content.json, sections 5 and 6 and slides S17 through S22"
      - "docs/facilitator-runbook.md, the run of show and the cut order"
      - "docs/sections/section-5-agent-mode.md and docs/sections/section-6-wrap-up.md"

